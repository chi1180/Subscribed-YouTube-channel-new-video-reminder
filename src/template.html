<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New videos from your subscriptions</title>
    <style>
      :root {
        --bg: #0f1115;
        --surface: #161a21;
        --ink: #e6e8ec;
        --ink-muted: #a7acb4;
        --border: #2a2f39;
        --accent: #d9d9d9;
        --accent-soft: #1f242d;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg);
        color: var(--ink);
        line-height: 1.5;
        padding: 24px 12px;
      }

      .container {
        max-width: 720px;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        overflow: hidden;
      }

      .header {
        padding: 24px 28px 16px 28px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.1px;
      }

      .subtitle {
        margin-top: 4px;
        font-size: 13px;
        color: var(--ink-muted);
      }

      .section {
        padding: 18px 28px 6px 28px;
      }

      .channel {
        padding: 18px 0;
        border-top: 1px solid var(--border);
      }

      .channel:first-of-type {
        border-top: 0;
      }

      .channel-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .video {
        display: block;
        padding: 12px 12px;
        border: 1px solid var(--border);
        border-radius: 2px;
        text-decoration: none;
        color: inherit;
        background: var(--surface);
        margin-bottom: 10px;
        transition:
          box-shadow 0.2s ease,
          border-color 0.2s ease;
      }

      .video:hover {
        border-color: var(--accent);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      }

      .video:last-child {
        margin-bottom: 0;
      }

      .video-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 6px;
      }

      .video-desc {
        font-size: 13px;
        color: var(--ink-muted);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .pill {
        display: inline-block;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        margin-left: 8px;
        vertical-align: middle;
      }

      .footer {
        padding: 16px 28px 24px 28px;
        color: var(--ink-muted);
        font-size: 12px;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="title">New uploads from your subscriptions</div>
        <div class="subtitle">A clean digest of the latest videos since yesterday</div>
      </div>

      <div class="section">
        <? for (const data of mailData) { ?>
        <section class="channel">
          <div class="channel-title"><?= data.channelTitle ?></div>
          <? for (const video of data.videos) { ?>
          <a href="<?= video.link ?>" class="video">
            <div class="video-title"><?= video.title ?></div>
            <div class="video-desc"><?= video.description ?></div>
          </a>
          <? } ?>
        </section>
        <? } ?>
      </div>

      <div class="footer">
        You’re receiving this because you subscribed to these channels. You can edit your subscriptions in
        YouTube.
      </div>
    </div>
  </body>
</html>
